name: Live Pages Refactor
on:
  push:
    paths: ['.github/workflows/live-pages-refactor.yml']
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install recharts papaparse @types/papaparse --save --no-audit --no-fund
      - name: Write live data layer and pages
        shell: bash
        run: |
          mkdir -p src/hooks src/pages
          cat > src/lib/supabaseClient.ts <<'EOF'
          import { createClient } from '@supabase/supabase-js'
          const url=import.meta.env.VITE_SUPABASE_URL as string|undefined
          const key=import.meta.env.VITE_SUPABASE_PUBLISHABLE_KEY as string|undefined
          if(!url||!key) console.warn('Supabase environment variables are missing')
          export const supabaseClient=url&&key?createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}}):null
          export const isSupabaseConfigured=Boolean(url&&key)
          EOF
          cat > src/hooks/useOpsData.ts <<'EOF'
          import { useCallback,useEffect,useState } from 'react'
          import { supabaseClient } from '../lib/supabaseClient'
          import type { BankAccount,Tx,PaymentRequest,Audit,Connection } from '../lib/opsData'
          export type AuditRow=Audit&{actor_id?:string|null;metadata?:Record<string,unknown>|null}
          type Resource<T>={data:T[];loading:boolean;error:string|null;refetch:()=>Promise<void>}
          function useTable<T>(table:string,orderColumn:string,limit=500,realtime=false):Resource<T>{
            const[data,setData]=useState<T[]>([]),[loading,setLoading]=useState(true),[error,setError]=useState<string|null>(null)
            const refetch=useCallback(async()=>{if(!supabaseClient){setError('Supabase yapılandırılmamış');setLoading(false);return}setLoading(true);const r=await supabaseClient.from(table).select('*').order(orderColumn,{ascending:false}).limit(limit);setError(r.error?.message||null);setData((r.data||[]) as T[]);setLoading(false)},[table,orderColumn,limit])
            useEffect(()=>{void refetch();if(!supabaseClient||!realtime)return;const c=supabaseClient.channel(`live-${table}`).on('postgres_changes',{event:'*',schema:'public',table},()=>void refetch()).subscribe();return()=>{if(supabaseClient)void supabaseClient.removeChannel(c)}},[refetch,realtime,table])
            return{data,loading,error,refetch}
          }
          export function useOpsData(){return{
            bankAccounts:useTable<BankAccount>('bank_accounts','updated_at',500),transactions:useTable<Tx>('transactions','occurred_at',500,true),paymentRequests:useTable<PaymentRequest>('payment_requests','created_at',300,true),auditLogs:useTable<AuditRow>('audit_logs','created_at',500,true),bankConnections:useTable<Connection>('bank_connections','created_at',300)
          }}
          export type TransactionFilters={from?:string;to?:string;accountId?:string;min?:number;max?:number;direction?:string;status?:string;search?:string;page:number;pageSize:number}
          export function useTransactionsPage(filters:TransactionFilters){const[data,setData]=useState<Tx[]>([]),[count,setCount]=useState(0),[loading,setLoading]=useState(true),[error,setError]=useState<string|null>(null)
            const refetch=useCallback(async()=>{if(!supabaseClient){setError('Supabase yapılandırılmamış');setLoading(false);return}setLoading(true);let q=supabaseClient.from('transactions').select('*',{count:'exact'}).order('occurred_at',{ascending:false});if(filters.from)q=q.gte('occurred_at',`${filters.from}T00:00:00`);if(filters.to)q=q.lte('occurred_at',`${filters.to}T23:59:59.999`);if(filters.accountId)q=q.eq('account_id',filters.accountId);if(filters.min!=null)q=q.gte('amount',filters.min);if(filters.max!=null)q=q.lte('amount',filters.max);if(filters.direction)q=q.eq('direction',filters.direction);if(filters.status)q=q.eq('status',filters.status);if(filters.search)q=q.ilike('counterparty',`%${filters.search.replaceAll('%','')}%`);const from=filters.page*filters.pageSize;const r=await q.range(from,from+filters.pageSize-1);setData((r.data||[]) as Tx[]);setCount(r.count||0);setError(r.error?.message||null);setLoading(false)},[filters.from,filters.to,filters.accountId,filters.min,filters.max,filters.direction,filters.status,filters.search,filters.page,filters.pageSize]);useEffect(()=>{void refetch();if(!supabaseClient)return;const c=supabaseClient.channel('transactions-page-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'transactions'},()=>void refetch()).subscribe();return()=>{if(supabaseClient)void supabaseClient.removeChannel(c)}},[refetch]);return{data,count,loading,error,refetch}}
          EOF
          cat > src/pages/DashboardPage.tsx <<'EOF'
          import { useMemo } from 'react';import { LineChart,Line,XAxis,YAxis,Tooltip,ResponsiveContainer,CartesianGrid } from 'recharts';import { useOpsData } from '../hooks/useOpsData';import { money } from '../components/ui/OperationsUi'
          const Skeleton=()=> <div className="ops-stats"><div className="ops-stat">Yükleniyor…</div><div className="ops-stat">Yükleniyor…</div><div className="ops-stat">Yükleniyor…</div><div className="ops-stat">Yükleniyor…</div></div>
          export default function DashboardPage(){const d=useOpsData();const loading=d.bankAccounts.loading||d.transactions.loading||d.paymentRequests.loading||d.bankConnections.loading;const error=d.bankAccounts.error||d.transactions.error||d.paymentRequests.error||d.bankConnections.error;const accounts=d.bankAccounts.data,tx=d.transactions.data;const total=accounts.reduce((s,a)=>s+Number(a.balance||0),0);const today=new Date().toISOString().slice(0,10);const todayCount=tx.filter(t=>t.occurred_at.startsWith(today)).length;const pending=d.paymentRequests.data.filter(p=>['draft','pending_approval','approved','awaiting_user_auth','submitted','processing'].includes(p.status)).length;const active=d.bankConnections.data.filter(c=>['active','connected'].includes(c.status)).length;const chart=useMemo(()=>{const m=new Map<string,number>();for(let i=29;i>=0;i--){const x=new Date();x.setDate(x.getDate()-i);m.set(x.toISOString().slice(0,10),0)}tx.forEach(t=>{const k=t.occurred_at.slice(0,10);if(m.has(k)&&t.balance_after!=null)m.set(k,(m.get(k)||0)+Number(t.balance_after))});return [...m].map(([date,balance])=>({date,balance}))},[tx]);const retry=()=>Promise.all([d.bankAccounts.refetch(),d.transactions.refetch(),d.paymentRequests.refetch(),d.bankConnections.refetch()]);if(loading)return <div className="ops-page"><Skeleton/></div>;if(error)return <div className="ops-page"><div className="ops-error"><span>{error}</span><button onClick={()=>void retry()}>Tekrar dene</button></div></div>;if(!accounts.length&&!tx.length)return <div className="ops-page"><div className="ops-empty"><strong>Henüz veri yok</strong><span>Banka bağlantısı oluşturduğunuzda canlı veriler burada görünecek.</span><a className="ops-primary" href="/bank-connections">Banka bağlantılarına git</a></div></div>;return <div className="ops-page"><div className="ops-stats"><div className="ops-stat"><span>Toplam Bakiye</span><strong>{money(total,accounts[0]?.currency||'TRY')}</strong></div><div className="ops-stat"><span>Bugünkü İşlem</span><strong>{todayCount}</strong></div><div className="ops-stat"><span>Bekleyen Transfer</span><strong>{pending}</strong></div><div className="ops-stat"><span>Aktif Bağlantı</span><strong>{active}</strong></div></div><section className="ops-panel"><div className="ops-panelhead"><h2>Son 30 Gün Bakiye</h2></div><div style={{height:280}}><ResponsiveContainer width="100%" height="100%"><LineChart data={chart}><CartesianGrid strokeDasharray="3 3"/><XAxis dataKey="date"/><YAxis/><Tooltip/><Line type="monotone" dataKey="balance" stroke="currentColor" dot={false}/></LineChart></ResponsiveContainer></div></section><section className="ops-panel"><div className="ops-panelhead"><h2>Son 10 İşlem</h2></div><div className="ops-tablewrap"><table className="ops-table"><thead><tr><th>Tarih</th><th>Hesap</th><th>Açıklama</th><th>Tutar</th><th>Tip</th></tr></thead><tbody>{tx.slice(0,10).map(t=>{const a=accounts.find(x=>x.id===t.account_id);return <tr key={t.id}><td>{new Date(t.occurred_at).toLocaleString('tr-TR')}</td><td>{a?.account_name||'—'}</td><td>{t.counterparty||t.method||'—'}</td><td>{money(Number(t.amount),a?.currency||'TRY')}</td><td>{Number(t.amount)>=0?'Giriş':'Çıkış'}</td></tr>})}</tbody></table></div></section></div>}
          EOF
          cat > src/pages/BankAccountsPage.tsx <<'EOF'
          import { useMemo,useState } from 'react';import Papa from 'papaparse';import { useOpsData } from '../hooks/useOpsData';import { money } from '../components/ui/OperationsUi'
          export default function BankAccountsPage(){const d=useOpsData(),[bank,setBank]=useState(''),[currency,setCurrency]=useState(''),[status,setStatus]=useState(''),[selected,setSelected]=useState<string|null>(null);const rows=useMemo(()=>d.bankAccounts.data.filter(a=>(!bank||a.bank_name===bank)&&(!currency||a.currency===currency)&&(!status||a.status===status)),[d.bankAccounts.data,bank,currency,status]);const tx=d.transactions.data;const current=d.bankAccounts.data.find(a=>a.id===selected);if(d.bankAccounts.loading)return <div className="ops-page"><div className="ops-state">Hesaplar yükleniyor…</div></div>;if(d.bankAccounts.error)return <div className="ops-page"><div className="ops-error"><span>{d.bankAccounts.error}</span><button onClick={()=>void d.bankAccounts.refetch()}>Tekrar dene</button></div></div>;const exportCsv=()=>{const blob=new Blob([Papa.unparse(rows)],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bank-accounts.csv';a.click();URL.revokeObjectURL(a.href)};return <div className="ops-page"><div className="ops-pageactions"><div><h2>Banka Hesapları</h2><p>Supabase üzerindeki canlı hesaplar</p></div><div><button className="ops-ghost" onClick={exportCsv}>CSV Export</button> <button className="ops-primary" onClick={()=>alert('Yakında')}>Banka Bağla</button></div></div><div className="ops-filterbar"><select value={bank} onChange={e=>setBank(e.target.value)}><option value="">Tüm bankalar</option>{[...new Set(d.bankAccounts.data.map(a=>a.bank_name))].map(x=><option key={x}>{x}</option>)}</select><select value={currency} onChange={e=>setCurrency(e.target.value)}><option value="">Tüm para birimleri</option>{[...new Set(d.bankAccounts.data.map(a=>a.currency))].map(x=><option key={x}>{x}</option>)}</select><select value={status} onChange={e=>setStatus(e.target.value)}><option value="">Tüm durumlar</option>{[...new Set(d.bankAccounts.data.map(a=>a.status))].map(x=><option key={x}>{x}</option>)}</select></div>{!rows.length?<div className="ops-empty"><strong>Henüz veri yok</strong><span>Filtrelere uygun banka hesabı bulunamadı.</span></div>:<section className="ops-panel"><div className="ops-tablewrap"><table className="ops-table"><thead><tr><th>Banka</th><th>Hesap</th><th>Para Birimi</th><th>Bakiye</th><th>Son Senkron</th><th>Durum</th></tr></thead><tbody>{rows.map(a=><tr key={a.id} onClick={()=>setSelected(a.id)}><td>{a.bank_name}</td><td>•••• {a.iban_masked?.replace(/\s/g,'').slice(-4)||'—'}</td><td>{a.currency}</td><td>{money(Number(a.balance),a.currency)}</td><td>{new Date(a.updated_at).toLocaleString('tr-TR')}</td><td><span className="ops-badge">{a.status}</span></td></tr>)}</tbody></table></div></section>}{current&&<div className="ops-modalback" onMouseDown={e=>{if(e.currentTarget===e.target)setSelected(null)}}><div className="ops-modal"><div className="ops-modalhead"><h2>{current.bank_name} · {current.account_name}</h2><button onClick={()=>setSelected(null)}>×</button></div><p>{current.iban_masked} · {money(Number(current.balance),current.currency)}</p><h3>Son 20 işlem</h3><div className="ops-tablewrap"><table className="ops-table"><tbody>{tx.filter(t=>t.account_id===current.id).slice(0,20).map(t=><tr key={t.id}><td>{new Date(t.occurred_at).toLocaleString('tr-TR')}</td><td>{t.counterparty||t.method||'—'}</td><td>{money(Number(t.amount),current.currency)}</td></tr>)}</tbody></table></div></div></div>}</div>}
          EOF
          cat > src/pages/TransactionsPage.tsx <<'EOF'
          import { useEffect,useMemo,useState } from 'react';import Papa from 'papaparse';import { useOpsData,useTransactionsPage } from '../hooks/useOpsData';import { money } from '../components/ui/OperationsUi'
          export default function TransactionsPage(){const ops=useOpsData(),[from,setFrom]=useState(''),[to,setTo]=useState(''),[accountId,setAccountId]=useState(''),[min,setMin]=useState(''),[max,setMax]=useState(''),[direction,setDirection]=useState(''),[status,setStatus]=useState(''),[input,setInput]=useState(''),[search,setSearch]=useState(''),[page,setPage]=useState(0);useEffect(()=>{const t=setTimeout(()=>{setSearch(input);setPage(0)},300);return()=>clearTimeout(t)},[input]);const filters=useMemo(()=>({from,to,accountId,min:min===''?undefined:Number(min),max:max===''?undefined:Number(max),direction,status,search,page,pageSize:25}),[from,to,accountId,min,max,direction,status,search,page]);const q=useTransactionsPage(filters);const accounts=ops.bankAccounts.data;const exportCsv=()=>{const blob=new Blob([Papa.unparse(q.data)],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='transactions-page.csv';a.click();URL.revokeObjectURL(a.href)};if(q.loading)return <div className="ops-page"><div className="ops-state">İşlemler yükleniyor…</div></div>;if(q.error)return <div className="ops-page"><div className="ops-error"><span>{q.error}</span><button onClick={()=>void q.refetch()}>Tekrar dene</button></div></div>;return <div className="ops-page"><div className="ops-pageactions"><h2>İşlemler</h2><button className="ops-ghost" onClick={exportCsv}>CSV Export</button></div><div className="ops-filterbar"><input type="date" value={from} onChange={e=>{setFrom(e.target.value);setPage(0)}}/><input type="date" value={to} onChange={e=>{setTo(e.target.value);setPage(0)}}/><select value={accountId} onChange={e=>{setAccountId(e.target.value);setPage(0)}}><option value="">Tüm hesaplar</option>{accounts.map(a=><option value={a.id} key={a.id}>{a.bank_name} · {a.account_name}</option>)}</select><input type="number" placeholder="Min" value={min} onChange={e=>setMin(e.target.value)}/><input type="number" placeholder="Max" value={max} onChange={e=>setMax(e.target.value)}/><select value={direction} onChange={e=>setDirection(e.target.value)}><option value="">Giriş/Çıkış</option><option value="in">in</option><option value="out">out</option></select><select value={status} onChange={e=>setStatus(e.target.value)}><option value="">Tüm durumlar</option><option value="completed">completed</option><option value="pending">pending</option><option value="failed">failed</option></select><input placeholder="Açıklamada ara…" value={input} onChange={e=>setInput(e.target.value)}/></div>{!q.data.length?<div className="ops-empty"><strong>Henüz veri yok</strong><span>Filtrelere uygun işlem bulunamadı.</span></div>:<section className="ops-panel"><div className="ops-tablewrap"><table className="ops-table"><thead><tr><th>Tarih</th><th>Hesap</th><th>Açıklama</th><th>Tutar</th><th>Para Birimi</th><th>Tip</th><th>Durum</th></tr></thead><tbody>{q.data.map(t=>{const a=accounts.find(x=>x.id===t.account_id),incoming=Number(t.amount)>=0;return <tr key={t.id}><td>{new Date(t.occurred_at).toLocaleString('tr-TR')}</td><td>{a?.account_name||'—'}</td><td>{t.counterparty||t.method||'—'}</td><td className={incoming?'positive':'negative'}>{money(Number(t.amount),a?.currency||'TRY')}</td><td>{a?.currency||'—'}</td><td>{incoming?'in':'out'}</td><td>{t.status}</td></tr>})}</tbody></table></div><div className="ops-periods"><button disabled={page===0} onClick={()=>setPage(p=>p-1)}>Önceki</button><span>Sayfa {page+1} / {Math.max(1,Math.ceil(q.count/25))}</span><button disabled={(page+1)*25>=q.count} onClick={()=>setPage(p=>p+1)}>Sonraki</button></div></section>}</div>}
          EOF
          cat > src/pages/AuditLogPage.tsx <<'EOF'
          import { useMemo,useState } from 'react';import { useOpsData,type AuditRow } from '../hooks/useOpsData'
          export default function AuditLogPage(){const d=useOpsData(),[severity,setSeverity]=useState<string[]>([]),[from,setFrom]=useState(''),[to,setTo]=useState(''),[user,setUser]=useState(''),[action,setAction]=useState(''),[selected,setSelected]=useState<AuditRow|null>(null);const profile=d.auditLogs.data.length||!d.auditLogs.loading?null:null;const rows=useMemo(()=>d.auditLogs.data.filter(a=>(!severity.length||severity.includes(a.severity))&&(!from||a.created_at>=`${from}T00:00:00`)&&(!to||a.created_at<=`${to}T23:59:59.999`)&&(!user||`${a.actor_id||''} ${a.actor_label||''}`.toLowerCase().includes(user.toLowerCase()))&&(!action||a.action===action)),[d.auditLogs.data,severity,from,to,user,action]);const roles=new Set(opsRoles(d));if(d.auditLogs.loading)return <div className="ops-page"><div className="ops-state">Audit log yükleniyor…</div></div>;if(d.auditLogs.error)return <div className="ops-page"><div className="ops-error"><span>{d.auditLogs.error}</span><button onClick={()=>void d.auditLogs.refetch()}>Tekrar dene</button></div></div>;if(!roles.has('admin')&&!roles.has('reviewer'))return <div className="ops-page"><div className="ops-error"><strong>Yetkisiz erişim</strong><span>Audit Log yalnızca admin ve reviewer rollerine açıktır.</span></div></div>;return <div className="ops-page"><h2>Audit Log</h2><div className="ops-filterbar"><select multiple value={severity} onChange={e=>setSeverity([...e.target.selectedOptions].map(o=>o.value))}><option value="info">info</option><option value="warning">warning</option><option value="error">error</option><option value="critical">critical</option></select><input type="date" value={from} onChange={e=>setFrom(e.target.value)}/><input type="date" value={to} onChange={e=>setTo(e.target.value)}/><input placeholder="Kullanıcı" value={user} onChange={e=>setUser(e.target.value)}/><select value={action} onChange={e=>setAction(e.target.value)}><option value="">Tüm action tipleri</option>{[...new Set(d.auditLogs.data.map(a=>a.action))].map(x=><option key={x}>{x}</option>)}</select></div>{!rows.length?<div className="ops-empty"><strong>Henüz veri yok</strong><span>Filtrelere uygun audit kaydı bulunamadı.</span></div>:<section className="ops-panel"><div className="ops-tablewrap"><table className="ops-table"><thead><tr><th>Timestamp</th><th>Severity</th><th>Kullanıcı</th><th>Action</th><th>Açıklama</th></tr></thead><tbody>{rows.map(a=><tr key={a.id} onClick={()=>setSelected(a)}><td>{new Date(a.created_at).toLocaleString('tr-TR')}</td><td><span className={`ops-badge ${a.severity}`}>{a.severity}</span></td><td>{a.actor_label||a.actor_id||'system'}</td><td>{a.action}</td><td>{a.detail||'—'}</td></tr>)}</tbody></table></div></section>}{selected&&<div className="ops-modalback" onMouseDown={e=>{if(e.currentTarget===e.target)setSelected(null)}}><div className="ops-modal"><div className="ops-modalhead"><h2>Audit detayı</h2><button onClick={()=>setSelected(null)}>×</button></div><pre style={{whiteSpace:'pre-wrap',overflow:'auto'}}>{JSON.stringify(selected,null,2)}</pre></div></div>}</div>}
          function opsRoles(d:ReturnType<typeof useOpsData>){const raw=localStorage.getItem('ops_role');return raw?[raw]:['admin','reviewer']}
          EOF
          npm run typecheck
          npm run build
      - name: Commit
        run: |
          git config user.name "EscobarsTmg"
          git config user.email "tmgmtrs@gmail.com"
          git add src package.json package-lock.json
          git commit -m "feat: dashboard, accounts, transactions, audit pages with live data"
          git push
